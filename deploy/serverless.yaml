AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SSFMS serverless extras: a scheduled health monitor (Lambda + EventBridge)
  that writes to DynamoDB and raises SNS alerts, a CloudWatch dashboard, and a
  Cognito user pool (scaffolded for future login migration). Deploy in the
  project region (ap-southeast-2) after the core stack.

Parameters:
  ProjectName:
    Type: String
    Default: ssfms
  Environment:
    Type: String
    Default: prod

  HealthUrl:
    Type: String
    Description: Public health endpoint, e.g. https://<cloudfront>/api/health

  AlertEmail:
    Type: String
    Default: soumikcodes4158@gmail.com

Resources:
  # --------------------------------------------------------------- DynamoDB
  HealthEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-health-events"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: timestamp
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ------------------------------------------------------------------- SNS
  HealthAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-health-alerts"

  HealthAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref HealthAlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ----------------------------------------------------------------- Lambda
  HealthMonitorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: health-monitor
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !Sub "${HealthEventsTable.Arn}"
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref HealthAlertTopic

  HealthMonitorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-health-monitor"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt HealthMonitorRole.Arn
      Timeout: 20
      MemorySize: 128
      Environment:
        Variables:
          HEALTH_URL: !Ref HealthUrl
          TABLE_NAME: !Ref HealthEventsTable
          SNS_TOPIC_ARN: !Ref HealthAlertTopic
      Code:
        ZipFile: |
          import os
          import urllib.request
          from datetime import datetime, timezone

          import boto3

          HEALTH_URL = os.environ["HEALTH_URL"]
          TABLE_NAME = os.environ["TABLE_NAME"]
          SNS_TOPIC_ARN = os.environ["SNS_TOPIC_ARN"]


          def handler(event, context):
              timestamp = datetime.now(timezone.utc).isoformat()
              ok = False
              detail = ""
              try:
                  with urllib.request.urlopen(HEALTH_URL, timeout=8) as response:
                      ok = response.status == 200
                      detail = response.read().decode("utf-8", "replace")[:200]
              except Exception as exc:  # noqa: BLE001
                  detail = f"{type(exc).__name__}: {exc}"[:200]

              boto3.resource("dynamodb").Table(TABLE_NAME).put_item(
                  Item={"timestamp": timestamp, "ok": ok, "detail": detail}
              )

              if not ok:
                  boto3.client("sns").publish(
                      TopicArn=SNS_TOPIC_ARN,
                      Subject="SSFMS health check FAILED",
                      Message=(
                          f"Health check failed at {timestamp}\n"
                          f"URL: {HEALTH_URL}\n{detail}"
                      ),
                  )

              return {"ok": ok, "timestamp": timestamp}

  # ------------------------------------------------------------- EventBridge
  HealthScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-health-check"
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt HealthMonitorFunction.Arn
          Id: health-monitor

  HealthSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HealthMonitorFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HealthScheduleRule.Arn

  # ------------------------------------------------------------ CloudWatch
  OverviewDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ProjectName}-${Environment}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${HealthMonitorFunction}", { "stat": "Sum" }],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${HealthMonitorFunction}", { "stat": "Sum" }]
                ],
                "region": "${AWS::Region}",
                "period": 300,
                "title": "Health monitor"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  ["AWS/EC2", "CPUUtilization", { "stat": "Average" }]
                ],
                "region": "${AWS::Region}",
                "period": 300,
                "title": "App instance CPU"
              }
            }
          ]
        }

  # ---------------------------------------------------------------- Cognito
  # Scaffolded for a future migration off the custom JWT login. The app still
  # authenticates with its own FastAPI /login token for now.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-${Environment}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${ProjectName}-${Environment}-client"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

Outputs:
  HealthEventsTableName:
    Value: !Ref HealthEventsTable

  HealthMonitorFunctionName:
    Value: !Ref HealthMonitorFunction

  HealthAlertTopicArn:
    Value: !Ref HealthAlertTopic

  CognitoUserPoolId:
    Value: !Ref UserPool

  CognitoClientId:
    Value: !Ref UserPoolClient
