AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SSFMS - Smart School Food Management System.
  Track 1 stack: one ARM EC2 instance running the FastAPI container and
  PostgreSQL via Docker Compose, a private S3 bucket for the React build,
  and a single CloudFront distribution that serves the site at / and proxies
  /api/* to the instance. HTTPS everywhere, no NAT gateway, no open SSH.

Parameters:
  ProjectName:
    Type: String
    Default: ssfms
    AllowedPattern: "^[a-z0-9-]{3,20}$"

  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium, t4g.large]

  RepoUrl:
    Type: String
    Default: https://github.com/soumikcodes4158-gif/Food-management.git

  RepoBranch:
    Type: String
    Default: soumik

  AlertEmail:
    Type: String
    Default: soumikcodes4158@gmail.com
    Description: Receives SNS alarm and budget notifications (must be confirmed).

  MonthlyBudgetUsd:
    Type: Number
    Default: 25
    MinValue: 1
    MaxValue: 1000

  CloudFrontPrefixListId:
    Type: String
    Default: pl-b8a742d1
    Description: >
      Managed prefix list "com.amazonaws.global.cloudfront.origin-facing" in
      ap-southeast-2. This ID is region-specific; override if deploying
      elsewhere (look up via `aws ec2 describe-managed-prefix-lists`).

  AmiSsmParameter:
    Type: String
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: >
      Amazon Linux 2023 AMI. Use .../al2023-ami-kernel-default-x86_64 together
      with a t3 instance family; the default matches the ARM t4g family.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # ------------------------------------------------------------------ network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-vpc"

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-public"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-igw"

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-rt"

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # ------------------------------------------------------------- app instance
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSFMS app instance - API reachable only from CloudFront
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing requests only
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Package installs, GitHub clone, container pulls
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-app-sg"

  AppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ssfms-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DbSecret
                  - !Ref JwtSecret
                  - !Ref AdminSecret
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt BackupBucket.Arn
                  - !Sub "${BackupBucket.Arn}/*"
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/*"

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AppInstanceRole

  # Deployment metadata read by user-data. Keeping these in SSM means the
  # user-data script itself needs no template substitution and no escaping.
  RepoUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${Environment}/repo-url"
      Type: String
      Value: !Ref RepoUrl

  RepoBranchParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${Environment}/repo-branch"
      Type: String
      Value: !Ref RepoBranch

  StackNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${Environment}/stack-name"
      Type: String
      Value: !Ref AWS::StackName

  AppInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - DefaultRoute
      - SubnetRouteTableAssociation
      - RepoUrlParameter
      - RepoBranchParameter
      - StackNameParameter
      - BackupBucketParameter
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT30M
    Properties:
      ImageId: !Sub "{{resolve:ssm:${AmiSsmParameter}}}"
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      IamInstanceProfile: !Ref AppInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-app"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail

          APP_DIR="/opt/ssfms"
          export AWS_DEFAULT_REGION="$(curl -fsS http://169.254.169.254/latest/meta-data/placement/region)"

          param() {
            aws ssm get-parameter --name "$1" --query Parameter.Value --output text
          }
          secret() {
            aws secretsmanager get-secret-value --secret-id "$1" --query SecretString --output text
          }
          json_field() {
            python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$1"
          }

          APP_REPO="$(param /ssfms/prod/repo-url)"
          APP_BRANCH="$(param /ssfms/prod/repo-branch)"
          STACK_NAME="$(param /ssfms/prod/stack-name)"
          BACKUP_BUCKET="$(param /ssfms/prod/backup-bucket)"

          # 2 GB swap: pandas + scikit-learn + PostgreSQL on a 2 GB instance.
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >>/etc/fstab
          fi

          dnf install -y docker git cronie curl
          systemctl enable --now docker
          systemctl enable --now crond
          usermod -aG docker ec2-user

          case "$(uname -m)" in
            aarch64) COMPOSE_ARCH="aarch64" ;;
            *) COMPOSE_ARCH="x86_64" ;;
          esac
          mkdir -p /usr/libexec/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${COMPOSE_ARCH}" \
            -o /usr/libexec/docker/cli-plugins/docker-compose
          chmod +x /usr/libexec/docker/cli-plugins/docker-compose

          DB_JSON="$(secret ssfms/prod/db)"
          JWT_JSON="$(secret ssfms/prod/jwt)"
          ADMIN_JSON="$(secret ssfms/prod/admin)"

          DB_USER="$(printf '%s' "$DB_JSON" | json_field username)"
          DB_PASS="$(printf '%s' "$DB_JSON" | json_field password)"
          JWT_SECRET="$(printf '%s' "$JWT_JSON" | json_field secret)"
          ADMIN_USER="$(printf '%s' "$ADMIN_JSON" | json_field username)"
          ADMIN_PASS="$(printf '%s' "$ADMIN_JSON" | json_field password)"

          mkdir -p "$APP_DIR"
          umask 077
          cat >"$APP_DIR/.env" <<ENVFILE
          POSTGRES_DB=ssfms
          POSTGRES_USER=${DB_USER}
          POSTGRES_PASSWORD=${DB_PASS}
          JWT_SECRET=${JWT_SECRET}
          ADMIN_USERNAME=${ADMIN_USER}
          ADMIN_PASSWORD=${ADMIN_PASS}
          ADMIN_NAME=Administrator
          ACCESS_TOKEN_EXPIRE_MINUTES=480
          BACKUP_BUCKET=${BACKUP_BUCKET}
          ENVFILE
          umask 022

          if [ ! -d "$APP_DIR/app/.git" ]; then
            git clone --branch "$APP_BRANCH" --depth 1 "$APP_REPO" "$APP_DIR/app"
          fi

          cd "$APP_DIR/app"
          cp "$APP_DIR/.env" .env
          docker compose up -d --build

          install -m 0750 "$APP_DIR/app/deploy/backup.sh" "$APP_DIR/backup.sh"
          cat >/etc/cron.d/ssfms-backup <<'CRON'
          SHELL=/bin/bash
          PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin
          17 20 * * * root /opt/ssfms/backup.sh >>/var/log/ssfms-backup.log 2>&1
          CRON
          chmod 0644 /etc/cron.d/ssfms-backup

          # Only report success once the API answers its health check.
          RESULT=1
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              RESULT=0
              break
            fi
            sleep 10
          done

          /opt/aws/bin/cfn-signal -e $RESULT --stack "$STACK_NAME" \
            --resource AppInstance --region "$AWS_DEFAULT_REGION"

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref AppInstance
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-eip"

  # ------------------------------------------------------------------ secrets
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: ssfms/prod/db
      Description: SSFMS PostgreSQL credentials used by the app container
      GenerateSecretString:
        SecretStringTemplate: '{"username": "ssfms"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: ssfms/prod/jwt
      Description: SSFMS JWT signing key
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: secret
        PasswordLength: 64
        ExcludePunctuation: true

  AdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: ssfms/prod/admin
      Description: Bootstrap admin account for SSFMS
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  # ------------------------------------------------------------------ storage
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-site-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOac
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  BackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-backups-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-backups
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  BackupBucketParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${Environment}/backup-bucket"
      Type: String
      Value: !Ref BackupBucket

  # -------------------------------------------------------------------- CDN
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-${Environment}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn:
      - ElasticIp
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectName} ${Environment} - site + /api proxy"
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api-instance
            DomainName: !GetAtt AppInstance.PublicDnsName
            CustomOriginConfig:
              HTTPPort: 8000
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 10
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-instance
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # ------------------------------------------------------------ notifications
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: SSFMS alerts
      TopicName: !Sub "${ProjectName}-${Environment}-alerts"

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-high-cpu"
      AlarmDescription: App instance CPU above 80% for 10 minutes
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref AppInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  StatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-status-check-failed"
      AlarmDescription: Instance or system status check failed
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref AppInstance
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic

  # ---------------------------------------------------------------- guardrail
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-${Environment}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  SiteUrl:
    Description: HTTPS URL of the React application
    Value: !Sub "https://${SiteDistribution.DomainName}"

  ApiUrl:
    Description: HTTPS base URL for the FastAPI backend
    Value: !Sub "https://${SiteDistribution.DomainName}/api"

  ApiDocs:
    Value: !Sub "https://${SiteDistribution.DomainName}/api/docs"

  InstanceId:
    Description: Use with aws ssm start-session --target INSTANCE_ID
    Value: !Ref AppInstance

  FrontendBucketName:
    Value: !Ref FrontendBucket

  DistributionId:
    Description: CloudFront distribution serving the site and /api
    Value: !Ref SiteDistribution

  BackupBucketName:
    Value: !Ref BackupBucket

  AlertTopicArn:
    Value: !Ref AlertTopic

  AdminSecretName:
    Description: aws secretsmanager get-secret-value --secret-id ssfms/prod/admin
    Value: ssfms/prod/admin

  RestartCommand:
    Description: Redeploy after pushing to GitHub
    Value: !Sub "aws ssm send-command --instance-ids ${AppInstance} --document-name AWS-RunShellScript --parameters commands='cd /opt/ssfms/app && git pull && cp /opt/ssfms/.env .env && docker compose up -d --build'"
