AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub Actions deployment role for SSFMS. Creates an OIDC provider (once per
  account) and a role that only the configured repository/branch can assume.
  Deploy this in the same region as the application stack (ap-south-1).

Parameters:
  GitHubOrg:
    Type: String
    Default: soumikcodes4158-gif

  GitHubRepo:
    Type: String
    Default: Food-management

  Branch:
    Type: String
    Default: soumik

  ProjectName:
    Type: String
    Default: ssfms

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${Branch}"
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SyncFrontend
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub "arn:aws:s3:::${ProjectName}-*"
              - Sid: UploadFrontend
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-*/*"
              - Sid: InvalidateCdn
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: "*"
              - Sid: RunRemoteDeploy
                Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Sid: ReadDeployResult
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                Resource: "*"

Outputs:
  RoleArn:
    Description: Store as the GitHub secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
