name: Deploy SSFMS

# NOTE: GitHub Actions -> AWS OIDC is BLOCKED in this project.
# The "new AWS experience" service control policy denies
# iam:CreateOpenIDConnectProvider and iam:ListOpenIDConnectProviders, so the
# Configure AWS credentials (OIDC) step can never succeed here.
#
# This workflow is kept as reference and for accounts where OIDC is allowed.
# It is manual-only so pushes do not queue failing runs. For this project use
# the AWS CodePipeline stack (deploy/codepipeline.yaml) or deploy/deploy.ps1.
on:
  workflow_dispatch:

permissions:
  id-token: write # required for GitHub OIDC -> AWS, no long-lived keys
  contents: read

env:
  AWS_REGION: ap-southeast-2
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Relative /api base keeps the bundle domain-agnostic.
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

  deploy:
    name: Ship to AWS
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build frontend for CloudFront
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

      - name: Upload frontend to S3
        run: aws s3 sync dist/ "s3://${{ vars.FRONTEND_BUCKET }}" --delete --only-show-errors

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text

      - name: Update backend on the instance
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.APP_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "SSFMS deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["cd /opt/ssfms/app","git fetch --depth 1 origin ${GITHUB_SHA}","git checkout ${GITHUB_SHA}","cp /opt/ssfms/.env .env","docker compose up -d --build","docker image prune -f"]' \
            --query 'Command.CommandId' --output text)

          echo "SSM command: $COMMAND_ID"

          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.APP_INSTANCE_ID }}" \
              --query 'Status' --output text)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Cancelled|TimedOut|Failed) aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.APP_INSTANCE_ID }}" --query 'StandardErrorContent' --output text; exit 1 ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for the remote deploy" >&2
          exit 1
