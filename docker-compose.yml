# SSFMS production compose file (Track 1: single t4g.small instance).
# The API is reachable only from CloudFront; PostgreSQL never publishes a port.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ssfms}
      POSTGRES_USER: ${POSTGRES_USER:-ssfms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssfms} -d ${POSTGRES_DB:-ssfms}"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      API_PREFIX: /api
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ssfms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ssfms}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
